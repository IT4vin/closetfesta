# Deploy do administrativo usando Supabase gerenciado (sem backend legado).
# Para implantação via Render Blueprint; a implantação atual usa Static Site direto.
services:
  - type: web
    name: closet-festa-administrativo
    runtime: static
    buildCommand: npm install --ignore-scripts --no-audit --no-fund && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
