name: Frontend Readiness Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/frontend-readiness.yml"
      - "scripts/check-supabase-target.mjs"
      - "supabase/config.toml"
      - ".env"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Build e teste de permissões
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Verificar consistência de referência Supabase
        run: node scripts/check-supabase-target.mjs
      # TEMPORÁRIO: o lockfile atual não contém o pacote Supabase exigido
      # por package.json. A migração para npm ci será obrigatória antes do release.
      - name: Instalar dependências para diagnosticar o build
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Testar matriz de permissões
        run: npm run test:run -- src/__tests__/accessControl.test.ts src/__tests__/rentalLifecycle.test.ts src/__tests__/rentalOrderListing.test.ts src/__tests__/liveDataIntegrity.test.ts src/__tests__/operationalAnalytics.test.ts src/__tests__/rentalOrderDetails.test.ts src/__tests__/rentalOrderEditing.test.ts src/__tests__/rentalContractPrint.test.ts
      - name: Verificar build de produção
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example_for_ci_only
