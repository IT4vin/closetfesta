name: Frontend Readiness Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/frontend-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Build e teste de permissões
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependências sem scripts de instalação
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Testar matriz de permissões
        run: npm run test:run -- src/__tests__/accessControl.test.ts
      - name: Verificar build de produção
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example_for_ci_only
